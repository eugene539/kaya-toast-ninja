name: Android
# Debug APK on every push to main and every pull request (D-124: Android builds locally and here).
# No signing secrets are used; the release (Play internal testing) job arrives with the Google
# Play account.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform 36 and build-tools 36.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install (frozen lockfile, never npm)
        run: bun install --frozen-lockfile
      - name: Web build (release CSP kept)
        run: bun run build
      - name: Capacitor sync (Android)
        run: bunx cap sync android
      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Inspect the APK (package, SDK levels, permissions)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | tee badging.txt | head -5
          grep -q "package: name='com.geniusplusmath.kayatoastninja'" badging.txt
          grep -q "minSdkVersion:'24'" badging.txt
          grep -q "targetSdkVersion:'36'" badging.txt
          grep "uses-permission" badging.txt || true
          if grep -q "AD_ID" badging.txt; then echo "AD_ID must never be present"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: kaya-toast-ninja-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
